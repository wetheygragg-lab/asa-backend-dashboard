<body>
<div class="top"><h1>渠道后端数据分析看板</h1><div class="sub">更新：<span id="updated"></span>｜口径：日期+渠道+广告系列名称 outer join；ROI 统一重算</div></div>
<main>
  <section class="toolbar">
    <div class="group"><span class="label">渠道</span><button data-channel="全部" class="active">全部</button></div>
    <div class="group"><span class="label">词类</span><button data-brand="全部" class="active">全部</button><button data-brand="品牌词">品牌词</button><button data-brand="非品牌词">非品牌词</button></div>
    <div class="group"><span class="label">匹配</span><button data-match="全部" class="active">全部</button><button data-match="两边匹配">两边匹配</button><button data-match="仅广告端">仅广告端</button><button data-match="仅后端">仅后端</button></div>
    <div class="group"><span class="label">时间</span><input id="startDate" type="date" /><span class="label">至</span><input id="endDate" type="date" /><button id="allDate">全部日期</button><button id="last7">最近7天</button><button id="last14">最近14天</button><button id="thisMonth">本月</button></div>
    <input id="q" placeholder="搜索广告系列名称…" />
  </section>
  <section class="grid" id="kpis"></section>
  <section class="cols">
    <div class="panel"><h2>每日趋势：支出 / 总充值 / 注册</h2><canvas id="dailyChart" height="122"></canvas></div>
    <div class="panel"><h2>渠道表现</h2><div id="channelCards"></div></div>
  </section>
  <section class="cols3">
    <div class="panel"><h2>品牌 / 非品牌</h2><div id="brandCards"></div></div>
    <div class="panel"><h2>匹配诊断</h2><div id="matchCards"></div></div>
    <div class="panel"><h2>当前筛选说明</h2><div class="hint" id="filterInfo"></div></div>
  </section>
  <section class="tablewrap">
    <div class="thead"><b>日期 × 渠道 × 广告系列明细</b><span id="detailCount"></span></div>
    <div class="detail-controls">
      <div class="group"><span class="label">明细词类</span><button data-detail-brand="全部" class="active">全部</button><button data-detail-brand="品牌词">品牌词</button><button data-detail-brand="非品牌词">非品牌词</button></div>
      <div class="group"><span class="label">明细时间</span><input id="detailStartDate" type="date" /><span class="label">至</span><input id="detailEndDate" type="date" /><button id="detailAllDate">全部日期</button><button id="detailLast7">最近7天</button><button id="detailLast14">最近14天</button><button id="detailThisMonth">本月</button></div>
      <div class="group"><span class="label">广告系列筛选</span><select id="campaignFilter"><option value="全部">全部广告系列</option></select><button id="clearCampaign">清除广告系列</button></div>
    </div>
    <div id="detailSummary" class="detail-summary"></div>
    <div class="scroll"><table id="detailTbl"><thead></thead><tbody></tbody></table></div>
    <div class="foot">时间筛选器支持单日和任意日期区间；点击表头排序。</div>
  </section>
</main>

function fmt(k,v){if(['支出','新用户充值金额','总充值金额','注册成本'].includes(k))return cny(v); if(['点击率','安装率','激活率','新客充值率','新客使用率'].includes(k))return pct(v); if(['新用户ROI','总ROI'].includes(k))return roi(v); return num(v)}
function badge(v){let cls=v==='品牌词'?'b':v==='非品牌词'?'nb':v==='两边匹配'?'m':v==='仅广告端'?'ad':'be'; return `<span class="badge ${cls}">${v}</span>`}
function renderTable(id, cols, rows, sortKey, dir, onSort){rows=rows.slice().sort((a,b)=>{let av=a[sortKey],bv=b[sortKey]; if(typeof av==='string')return String(av).localeCompare(String(bv),'zh-CN')*dir; return (n(av)-n(bv))*dir}); $(`#${id} thead`).innerHTML='<tr>'+cols.map(k=>`<th class="${['date','渠道','广告系列名称','词类','匹配状态'].includes(k)?'':'num'}" data-k="${k}">${k}${sortKey===k?(dir>0?' ↑':' ↓'):''}</th>`).join('')+'</tr>'; $(`#${id} tbody`).innerHTML=rows.map(r=>'<tr>'+cols.map(k=>{let v=r[k]; if(k==='词类'||k==='匹配状态')v=badge(v); else if(!['date','渠道','广告系列名称'].includes(k))v=fmt(k,v); return `<td class="${['date','渠道','广告系列名称','词类','匹配状态'].includes(k)?'':'num'}">${v}</td>`}).join('')+'</tr>').join(''); $$(`#${id} th`).forEach(th=>th.onclick=()=>onSort(th.dataset.k));}
function renderInfo(rows,t){
  const mRows=rows.filter(r=>r.匹配状态==='两边匹配'), adRows=rows.filter(r=>r.匹配状态==='仅广告端'), beRows=rows.filter(r=>r.匹配状态==='仅后端');
  const mt=agg(mRows), adt=agg(adRows), bet=agg(beRows);
  const spendWarn = adt.支出>0 ? `；其中仅广告端支出 <b>${cny(adt.支出)}</b>，需要确认是无转化还是后端漏数/名称未对齐` : '；仅广告端支出为 0 或极低，风险较小';
  const backendWarn = bet.注册人数>0 || bet.总充值金额>0 ? `；仅后端有 <b>${num(bet.注册人数)}</b> 注册、<b>${cny(bet.总充值金额)}</b> 充值，需排查广告端是否漏导或归因命名不一致` : '；仅后端基本无注册/充值，影响较小';
  $('#filterInfo').innerHTML=`
    当前时间：<b>${$('#startDate').value||iso(minDate)}</b> 至 <b>${$('#endDate').value||iso(maxDate)}</b><br>
    当前渠道：<b>${channel}</b>；词类：<b>${brand}</b>；匹配状态：<b>${match}</b>；广告系列：<b>${campaign}</b><br>
    筛选后明细：<b>${rows.length}</b> 行；支出 <b>${cny(t.支出)}</b>；总ROI <b>${roi(t.总ROI)}</b><br><br>
    <b>匹配诊断说明：</b>当前数据按 <b>日期 + 渠道 + 广告系列名称</b> 对齐广告端与后端。<br>
    ① <b>两边匹配</b>：广告端有支出/展示/点击/安装，后端也有激活/注册/充值/使用，是最完整、最适合分析 ROI 的数据。当前 <b>${mRows.length}</b> 行，支出 <b>${cny(mt.支出)}</b>，注册 <b>${num(mt.注册人数)}</b>，总ROI <b>${roi(mt.总ROI)}</b>。<br>
    ② <b>仅广告端</b>：广告端有投放记录，但后端没有对应转化记录。通常代表无转化、后端漏数、日期口径不一致或广告系列名称未对齐。当前 <b>${adRows.length}</b> 行${spendWarn}。<br>
    ③ <b>仅后端</b>：后端有转化记录，但广告端没有对应投放记录。通常代表广告端漏导、后端归因补数、渠道/广告系列命名不一致。当前 <b>${beRows.length}</b> 行${backendWarn}。<br>
    <b>判断建议：</b>优先看“仅广告端”的支出是否高，以及“仅后端”的注册/充值是否高；如果金额或转化量高，就需要回到 Excel 检查日期、渠道、广告系列名称是否一致。
  `
}
function renderDetailSummary(t){
  const items=[
    ['汇总支出',cny(t.支出)],['汇总展示',num(t.展示次数)],['汇总点击',num(t.点击次数)],['汇总安装',num(t.安装次数)],['汇总激活',num(t.激活数)],['汇总注册',num(t.注册人数)],
    ['注册成本',cny(t.注册成本)],['新客充值人数',num(t.新用户充值人数)],['新客充值金额',cny(t.新用户充值金额)],['新用户ROI',roi(t.新用户ROI)],['总充值人数',num(t.总充值人数)],['总ROI',roi(t.总ROI)],
    ['新客充值率',pct(t.新客充值率)],['新客使用率',pct(t.新客使用率)]
  ];
  $('#detailSummary').innerHTML=items.map(([label,value])=>`<div class="summary-item"><div class="s-label">${label}</div><div class="s-val">${value}</div></div>`).join('');
}
function render(){let pageRows=filtered(), t=agg(pageRows), rows=detailFiltered(pageRows), dt=agg(rows); renderKpis(t); renderBreakdowns(pageRows); renderChart(pageRows); renderInfo(pageRows,t); renderDetailSummary(dt); $('#detailCount').textContent=rows.length+' 行'; renderTable('detailTbl',detailCols,rows,sortDetail,dirDetail,k=>{if(sortDetail===k)dirDetail*=-1;else{sortDetail=k;dirDetail=-1}render()});}
function initCampaignFilter(){
  const sel=$('#campaignFilter');
  [...new Set(rows0.map(r=>r.广告系列名称).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'zh-CN')).forEach(name=>{
    const opt=document.createElement('option'); opt.value=name; opt.textContent=name; sel.appendChild(opt);
  });
  sel.addEventListener('change',()=>{campaign=sel.value; render();});
  $('#clearCampaign').onclick=()=>{campaign='全部'; sel.value='全部'; render();};
}
function setDateRange(a,b){$('#startDate').value=iso(a); $('#endDate').value=iso(b); render();}
function setDetailDateRange(a,b){$('#detailStartDate').value=iso(a); $('#detailEndDate').value=iso(b); render();}
function init(){
  $('#updated').textContent=DATA.updated;
  initCampaignFilter();
  [...new Set(rows0.map(r=>r.渠道))].sort().forEach(ch=>{
    let b=document.createElement('button'); b.dataset.channel=ch; b.textContent=ch;
    document.querySelector('[data-channel="全部"]').parentElement.appendChild(b);
  });
  $('#startDate').value=iso(minDate); $('#endDate').value=iso(maxDate);
  $('#detailStartDate').value=iso(minDate); $('#detailEndDate').value=iso(maxDate);
  $$('[data-channel]').forEach(b=>b.onclick=()=>{channel=b.dataset.channel; $$('[data-channel]').forEach(x=>x.classList.toggle('active',x===b)); render();});
  $$('[data-brand]').forEach(b=>b.onclick=()=>{brand=b.dataset.brand; $$('[data-brand]').forEach(x=>x.classList.toggle('active',x===b)); render();});
  $$('[data-detail-brand]').forEach(b=>b.onclick=()=>{detailBrand=b.dataset.detailBrand; $$('[data-detail-brand]').forEach(x=>x.classList.toggle('active',x===b)); render();});
  $$('[data-match]').forEach(b=>b.onclick=()=>{match=b.dataset.match; $$('[data-match]').forEach(x=>x.classList.toggle('active',x===b)); render();});
  ['startDate','endDate','q','detailStartDate','detailEndDate'].forEach(id=>$('#'+id).addEventListener('input',render));
  $('#allDate').onclick=()=>setDateRange(minDate,maxDate); $('#last7').onclick=()=>setDateRange(dates[Math.max(0,dates.length-7)],maxDate); $('#last14').onclick=()=>setDateRange(dates[Math.max(0,dates.length-14)],maxDate); $('#thisMonth').onclick=()=>{let m=maxDate.slice(0,2); let ds=dates.filter(d=>d.slice(0,2)===m); setDateRange(ds[0],ds[ds.length-1]);};
  $('#detailAllDate').onclick=()=>setDetailDateRange(minDate,maxDate); $('#detailLast7').onclick=()=>setDetailDateRange(dates[Math.max(0,dates.length-7)],maxDate); $('#detailLast14').onclick=()=>setDetailDateRange(dates[Math.max(0,dates.length-14)],maxDate); $('#detailThisMonth').onclick=()=>{let m=maxDate.slice(0,2); let ds=dates.filter(d=>d.slice(0,2)===m); setDetailDateRange(ds[0],ds[ds.length-1]);};
  render();
}
init();
</script>
</body>
</html>
