rsor:not-allowed}.pgr .pi{font-size:11px;color:#71767b;margin-right:auto}.mo{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:none;align-items:center;justify-content:center}.mo.op{display:flex}.mbox{background:#1a1d27;border:1px solid #2e3347;border-radius:12px;padding:20px;width:390px;max-width:95vw}.mbox h3{font-size:14px;margin-bottom:12px}.mf{margin-bottom:9px}.mf label{display:block;font-size:11px;color:#71767b;margin-bottom:3px}.mf input,.mf select{width:100%;padding:6px 9px;background:#242836;border:1px solid #2e3347;color:#e2e4ea;border-radius:5px;font-size:13px}.mac{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}.mac button{padding:6px 13px;border-radius:6px;cursor:pointer;font-size:12px;border:none}.mac .bc2{background:#242836;color:#71767b}.mac .bs{background:#00d084;color:#0f1419;font-weight:600}</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
var C=null,chs={};
var KPI=JSON.parse(localStorage.getItem('asa_kpi2')||'{}');
var ST={q:'all',mo:null,dt:null,ft:'all',pg:1,sz:50,sc:'date',sd:'desc'};
var CT={q:'all',mo:null,dt:null,ft:'all',pg:1,sz:50,sc:'date',sd:'desc',sel:[]};
var DCOLS=[["date", "日期"], ["支出", "支出(¥)"], ["展示次数", "展示"], ["点击次数", "点击"], ["安装次数", "安装"], ["激活数", "激活"], ["注册人数", "注册"], ["点击率", "CTR"], ["安装率", "安装率"], ["激活率", "激活率"], ["注册率", "注册率"], ["总充值金额", "充值(¥)"], ["roi", "充值ROI"], ["注册成本", "注册成本"]];
var CCOLS=[["date", "日期", null], ["广告系列名称", "系列名称", null], ["词类", "词类", null], ["支出", "支出(¥)", null], ["展示次数", "展示", null], ["点击次数", "点击", null], ["安装次数", "安装", null], ["激活数", "激活", null], ["注册人数", "注册", null], ["点击率", "CTR", null], ["安装率", "安装率", null], ["激活率", "激活率", null], ["注册率", "注册率", null], ["总充值金额", "充值(¥)", null], ["roi", "充值ROI", null], ["新客充值金额", "新客充值", null], ["新客充值人数", "新客充值人数", null], ["新客使用人数", "新客使用", null], ["注册成本", "注册成本", null]];
var TOTAL_S=139602.57689999996;var TOTAL_INS=40276;var TOTAL_RG=26297;
var TOTAL_ACT_R=1.334094746250869;var TOTAL_NU_RATE=0.0404989162261855;
var TOTAL_ROI=1.0447299988199577;var TOTAL_NU_ROI=0.567897826533602;var TOTAL_REG_COST=5.308688325664523;
var BRAND_RG=21763;var NB_RG=4534;
var $=function(id){return document.getElementById(id);};
function j(v){return(v==null||v==='')?0:+v||0;}
function pct(v){return(j(v)*100).toFixed(2)+'%';}
function cny(v){return'\u00a5'+j(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmt(v,d){d=d||0;return j(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function roiF(v){return j(v).toFixed(3);}
function fv(v,key){
  if(key==='date')return v;
  if(key==='支出'||key==='总充值金额'||key==='新客充值金额')return cny(v);
  var rates=['点击率','安装率','激活率','注册率','新客使用率','新客充值率'];
  if(rates.indexOf(key)>-1)return pct(v);
  if(key==='roi')return roiF(v);
  var costs=['注册成本','点击成本','安装成本'];
  if(costs.indexOf(key)>-1)return'\u00a5'+fmt(v,2);
  return fmt(v,0);}
window.onload=function(){
  try{
    var ta=document.getElementById('JSDATA');
    D=JSON.parse(ta.value);

    $('ld').style.display='none';

    $('ld').textContent='\u52a0\u8f7d\u5931\u8d25: '+e;

};
function agg(cs){
  var s=0,rg=0,ac=0,ins=0,cl=0,im=0,rv=0,nc=0,na=0,nu=0;
  for(var i=0;i<cs.length;i++){var c=cs[i];
    s+=j(c.支出);rg+=j(c.注册人数);ac+=j(c.激活数);ins+=j(c.安装次数);
    cl+=j(c.点击次数);im+=j(c.展示次数);rv+=j(c.总充值金额||0);
    nc+=j(c.新客充值人数||0);na+=j(c.新客充值金额||0);nu+=j(c.新客使用人数||0);}
  var r={支出:s,注册人数:rg,激活数:ac,安装次数:ins,点击次数:cl,展示次数:im,总充值金额:rv};
  r.ctr=cl/im||0;r.act_r=ac/ins||0;r.reg_r=ac/rg||0;r.roi=rv/s||0;
  r.reg_cost=s/rg||0;r.nu_rate=nc/rg||0;r.nu_roi=na/s||0;
  return r;}
function aggB(cs,b){return agg(cs.filter(function(c){return b?(c.词类==='品牌词'):(c.词类!=='品牌词');}));}
function getFCams(){
  var now=new Date();var thisMo=(now.getMonth()+1+'').padStart(2,'0');thisMo='2026-'+thisMo;
  var cs=C.campaigns;
  if(ST.dt&&ST.dt.length>0)cs=cs.filter(function(c){return ST.dt.indexOf(c.date)>-1;});
  else if(ST.q==='7d'){var ds=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);ds.push(((d.getMonth()+1)+'').padStart(2,'0')+'-'+((d.getDate())+'').padStart(2,'0'));}cs=cs.filter(function(c){return ds.indexOf(c.date)>-1;});}
  else if(ST.q==='30d'){var ds=[];for(var i=29;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);ds.push(((d.getMonth()+1)+'').padStart(2,'0')+'-'+((d.getDate())+'').padStart(2,'0'));}cs=cs.filter(function(c){return ds.indexOf(c.date)>-1;});}
  else if(ST.q==='month')cs=cs.filter(function(c){return c.date.substr(5,2)===thisMo.substr(5,2);});
  else if(ST.q==='last'){var lm=(now.getMonth()===0?'2025-12':'2026-'+((now.getMonth())+'').padStart(2,'0'));cs=cs.filter(function(c){return c.date.substr(5,2)===lm.substr(5,2);});}
  else if(ST.mo)cs=cs.filter(function(c){return c.date.substr(5,2)===ST.mo.substr(5,2);});
  if(ST.ft==='brand')cs=cs.filter(function(c){return c.词类==='品牌词';});
  else if(ST.ft==='nonbrand')cs=cs.filter(function(c){return c.词类!=='品牌词';});
  return cs;}

  else if(CT.q==='month')cs=cs.filter(function(c){return c.date.substr(5,2)===thisMo.substr(5,2);});

function getFDaily(){
  var now=new Date();var thisMo=(now.getMonth()+1+'').padStart(2,'0');thisMo='2026-'+thisMo;
