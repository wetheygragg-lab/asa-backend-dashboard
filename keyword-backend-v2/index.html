<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASA关键词后端数据分析看板</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script></head>
<body>
<header><h1>📊 ASA关键词后端数据分析看板</h1><p>广告端关键词数据 × 后端关键词数据｜支出以广告端 Sheet 为准｜生成于 <span id="genAt">—</span></p></header>
<section class="kpis"><div class="kpi"><span>总支出</span><b id="kSpend">—</b><small id="kSpendSub">—</small></div><div class="kpi green"><span>总安装</span><b id="kInstall">—</b><small id="kInstallSub">—</small></div><div class="kpi blue"><span>注册人数</span><b id="kReg">—</b><small id="kRegSub">—</small></div><div class="kpi yellow"><span>总充值</span><b id="kRev">—</b><small id="kRevSub">—</small></div><div class="kpi red"><span>注册成本</span><b id="kCost">—</b><small id="kCostSub">—</small></div></section>
<section class="compare"><div class="card"><h2>🌿 品牌词</h2><div id="brandBox"></div></div><div class="card"><h2>🔍 非品牌词</h2><div id="nonbrandBox"></div></div></section>
<section class="charts"><div class="card"><h2>每日支出 / 注册 / 充值</h2><canvas id="c1"></canvas></div><div class="card"><h2>每日注册成本 / ROI</h2><canvas id="c2"></canvas></div></section>
<section class="card"><div class="toolbar"><button data-f="all" class="active">全部</button><button data-f="brand">品牌词</button><button data-f="nonbrand">非品牌词</button><button data-f="7d">近7天</button><button data-f="month">本月</button><label class="datectl">开始 <input id="dateFrom" type="date"></label><label class="datectl">结束 <input id="dateTo" type="date"></label><button id="dateClear" type="button">清空时间</button><input id="q" placeholder="搜索关键词"><select id="sort"><option value="支出">按支出</option><option value="注册人数">按注册</option><option value="注册成本">按注册成本</option><option value="roi">按ROI</option><option value="安装次数">按安装</option></select><button id="csv">导出CSV</button></div><h2>关键词明细（<span id="count">—</span>条）</h2><div class="tablewrap"><table><thead><tr><th>关键词</th><th>词类</th><th>支出</th><th>展示</th><th>点击</th><th>安装</th><th>激活</th><th>注册</th><th>充值</th><th>安装成本</th><th>注册成本</th><th>点击率</th><th>安装率</th><th>激活率</th><th>注册率</th><th>ROI</th></tr></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table></div><div class="pager"><button id="prev">上一页</button><span id="page">—</span><button id="next">下一页</button></div></section>
<script src="app.js?v=20260617_date_filter"></script></body></html>
